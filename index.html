<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Quest — Mundo Seguro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Press Start 2P = fuente pixel; Noto Sans JP = soporte japonés -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Press Start 2P', 'Noto Sans JP', monospace;
      color: #fff;
      background: #0a0a1a;
      cursor: default;
    }

    /* ===================================================
       FONDO ANIMADO: cielo voxel con nubes y estrellas
       =================================================== */
    .sky {
      position: fixed; inset: 0;
      background: linear-gradient(180deg,
        #1a2a6c 0%,
        #4a3a9c 30%,
        #b06ab3 60%,
        #f8b6d0 85%,
        #ffd166 100%);
      z-index: 0;
    }

    /* Estrellas titilando (cubitos pixelados) */
    .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .stars span {
      position: absolute;
      width: 4px; height: 4px;
      background: #fff;
      box-shadow: 0 0 8px #fff;
      animation: twinkle 2s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.4); }
    }

    /* Montañas voxel en el horizonte */
    .mountains {
      position: fixed; bottom: 0; left: 0; right: 0; height: 40%;
      z-index: 2; pointer-events: none;
    }
    .mountain {
      position: absolute; bottom: 0;
      background: #2a1f4a;
      image-rendering: pixelated;
    }
    .m1 { left: -5%;  width: 35%; height: 60%;  background: #3a2a5c; clip-path: polygon(0 100%, 20% 40%, 40% 60%, 60% 20%, 80% 50%, 100% 30%, 100% 100%); }
    .m2 { left: 25%;  width: 40%; height: 75%;  background: #2a1f4a; clip-path: polygon(0 100%, 15% 50%, 35% 25%, 55% 45%, 75% 15%, 100% 40%, 100% 100%); }
    .m3 { left: 55%;  width: 50%; height: 55%;  background: #3a2a5c; clip-path: polygon(0 100%, 20% 50%, 40% 30%, 60% 50%, 80% 25%, 100% 45%, 100% 100%); }

    /* Suelo voxel */
    .ground {
      position: fixed; bottom: 0; left: 0; right: 0; height: 15%;
      background: linear-gradient(180deg, #4a6b2a, #2a3f1a);
      z-index: 3;
      border-top: 8px solid #6b8b3a;
    }

    /* Nubes pixeladas flotando */
    .cloud {
      position: fixed;
      background: #fff;
      opacity: 0.85;
      z-index: 2;
      box-shadow:
         20px  0  0 #fff,  40px  0  0 #fff,
         20px -20px 0 #fff, -20px 0 0 #fff,
        -20px -20px 0 #fff,  0  -20px 0 #fff;
      width: 20px; height: 20px;
      animation: drift linear infinite;
    }
    @keyframes drift {
      from { transform: translateX(-200px); }
      to   { transform: translateX(110vw); }
    }

    /* ===================================================
       CONTENIDO PRINCIPAL
       =================================================== */
    .container {
      position: relative; z-index: 10;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem;
    }

    .title {
      font-size: clamp(2rem, 7vw, 5rem);
      text-align: center;
      color: #FFD166;
      text-shadow:
        4px 4px 0 #6B3FA0,
        8px 8px 0 #2a1f4a,
        0 0 30px rgba(255, 209, 102, 0.5);
      margin-bottom: 1rem;
      letter-spacing: 4px;
      animation: titleBob 3s ease-in-out infinite;
    }
    @keyframes titleBob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    .subtitle {
      font-size: clamp(0.6rem, 1.4vw, 0.9rem);
      color: #fff;
      text-shadow: 2px 2px 0 #2a1f4a;
      margin-bottom: 3rem;
      text-align: center;
      letter-spacing: 2px;
      opacity: 0.9;
    }

    .menu {
      display: flex; flex-direction: column;
      gap: 1.2rem;
      width: min(420px, 90vw);
    }

    .btn {
      font-family: inherit;
      font-size: clamp(0.8rem, 1.6vw, 1.1rem);
      padding: 1.2rem 1.5rem;
      background: linear-gradient(180deg, #6B3FA0 0%, #4a2a78 100%);
      color: #fff;
      border: none;
      border-bottom: 6px solid #2a1f4a;
      border-right: 4px solid #2a1f4a;
      box-shadow:
        inset 2px 2px 0 rgba(255,255,255,0.2),
        4px 4px 0 rgba(0,0,0,0.4);
      cursor: pointer;
      letter-spacing: 2px;
      transition: transform 0.08s, box-shadow 0.08s, background 0.2s;
      text-shadow: 2px 2px 0 #2a1f4a;
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '▶';
      position: absolute;
      left: 1rem; top: 50%;
      transform: translateY(-50%) scale(0);
      transition: transform 0.2s;
      color: #FFD166;
    }
    .btn:hover {
      background: linear-gradient(180deg, #8b5fc0 0%, #6a3a98 100%);
      transform: translate(-2px, -2px);
      box-shadow:
        inset 2px 2px 0 rgba(255,255,255,0.3),
        6px 6px 0 rgba(0,0,0,0.5);
    }
    .btn:hover::before { transform: translateY(-50%) scale(1); }
    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 rgba(0,0,0,0.4);
    }

    .btn-primary {
      background: linear-gradient(180deg, #F2C744 0%, #c99a20 100%);
      color: #2a1f4a;
      border-bottom-color: #5a4310;
      border-right-color: #5a4310;
      text-shadow: 1px 1px 0 #fff;
    }
    .btn-primary:hover {
      background: linear-gradient(180deg, #ffd866 0%, #e0ad28 100%);
    }

    .btn:disabled {
      background: linear-gradient(180deg, #555 0%, #333 100%);
      cursor: not-allowed;
      opacity: 0.5;
      border-bottom-color: #1a1a1a;
      border-right-color: #1a1a1a;
    }
    .btn:disabled:hover { transform: none; box-shadow: 4px 4px 0 rgba(0,0,0,0.4); }
    .btn:disabled::before { display: none; }

    .footer {
      position: fixed; bottom: 1rem; left: 0; right: 0;
      text-align: center;
      font-size: 0.55rem;
      color: rgba(255,255,255,0.6);
      letter-spacing: 2px;
      z-index: 10;
    }

    /* ===================================================
       LUMA flotante en la esquina (saluda al jugador)
       =================================================== */
    .luma {
      position: fixed;
      bottom: 18%; right: 5%;
      width: 140px; height: 220px;
      z-index: 5;
      animation: lumaBob 1.6s ease-in-out infinite;
      image-rendering: pixelated;
    }
    @keyframes lumaBob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }
    .luma svg { width: 100%; height: 100%; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4)); }

    /* Burbuja de Luma */
    .luma-bubble {
      position: fixed;
      bottom: 38%; right: 16%;
      background: #fff;
      color: #2a1f4a;
      padding: 1rem 1.2rem;
      border: 4px solid #6B3FA0;
      border-radius: 8px;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      max-width: 240px;
      z-index: 6;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
      animation: lumaBob 1.6s ease-in-out infinite;
    }
    .luma-bubble::after {
      content: '';
      position: absolute;
      bottom: -16px; right: 30px;
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 16px solid #6B3FA0;
    }

    @media (max-width: 700px) {
      .luma, .luma-bubble { display: none; }
    }
  </style>
</head>
<body>

  <div class="sky"></div>
  <div class="stars" id="stars"></div>

  <div class="mountains">
    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>
  </div>

  <div class="ground"></div>

  <!-- Nubes voxel generadas por JS para variar -->

  <!-- ========================== LUMA ========================== -->
  <div class="luma-bubble">いらっしゃい！ぼうけんを始めよう！</div>
  <div class="luma">
    <!-- Mago voxel dibujado en SVG con bloques (mismo estilo que en el mundo) -->
    <svg viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
      <!-- Sombrero (cono escalonado) -->
      <rect x="38" y="0"  width="24" height="10" fill="#FFD166"/>
      <rect x="34" y="10" width="32" height="10" fill="#6B3FA0"/>
      <rect x="30" y="20" width="40" height="10" fill="#5A3578"/>
      <rect x="26" y="30" width="48" height="10" fill="#4A2A6B"/>
      <rect x="22" y="40" width="56" height="6"  fill="#3A1F5C"/>
      <!-- Cara -->
      <rect x="28" y="46" width="44" height="22" fill="#F5C9A0"/>
      <rect x="36" y="54" width="6"  height="8"  fill="#1A1A1A"/>
      <rect x="58" y="54" width="6"  height="8"  fill="#1A1A1A"/>
      <rect x="38" y="56" width="2"  height="2"  fill="#fff"/>
      <rect x="60" y="56" width="2"  height="2"  fill="#fff"/>
      <rect x="42" y="64" width="16" height="2"  fill="#1A1A1A"/>
      <!-- Cuello -->
      <rect x="40" y="68" width="20" height="4" fill="#F5C9A0"/>
      <!-- Túnica -->
      <rect x="20" y="72" width="60" height="40" fill="#6B3FA0"/>
      <rect x="20" y="92" width="60" height="6"  fill="#3A1F5C"/>
      <rect x="44" y="78" width="12" height="12" fill="#FFD166"/>
      <!-- Brazos -->
      <rect x="10" y="74" width="10" height="30" fill="#6B3FA0"/>
      <rect x="80" y="74" width="10" height="30" fill="#6B3FA0"/>
      <rect x="10" y="104" width="10" height="8" fill="#F5C9A0"/>
      <rect x="80" y="104" width="10" height="8" fill="#F5C9A0"/>
      <!-- Bastón -->
      <rect x="4"  y="58" width="6" height="60" fill="#5C4326"/>
      <rect x="0"  y="52" width="14" height="10" fill="#4FC3F7"/>
      <!-- Piernas -->
      <rect x="28" y="112" width="16" height="40" fill="#3B5BA8"/>
      <rect x="56" y="112" width="16" height="40" fill="#3B5BA8"/>
      <!-- Zapatos -->
      <rect x="26" y="150" width="20" height="10" fill="#2A1A0A"/>
      <rect x="54" y="150" width="20" height="10" fill="#2A1A0A"/>
    </svg>
  </div>

  <!-- ========================== MENÚ ========================== -->
  <div class="container">
    <h1 class="title">FOOD QUEST</h1>
    <p class="subtitle">~ El Mundo Seguro ~</p>

    <div class="menu">
      <button class="btn btn-primary" id="btn-new">NUEVA PARTIDA</button>
      <button class="btn" id="btn-continue" disabled>CONTINUAR</button>
      <button class="btn" id="btn-credits">CRÉDITOS</button>
    </div>
  </div>

  <div class="footer">© Wavex · A-Frame WebVR · 2026</div>

  <script>
    // -------------------------------------------------------
    // Generar estrellas titilando
    // -------------------------------------------------------
    const stars = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('span');
      s.style.left = Math.random() * 100 + '%';
      s.style.top  = Math.random() * 60 + '%';
      s.style.animationDelay = Math.random() * 2 + 's';
      s.style.opacity = 0.3 + Math.random() * 0.7;
      stars.appendChild(s);
    }

    // -------------------------------------------------------
    // Generar nubes voxel en distintas alturas / velocidades
    // -------------------------------------------------------
    for (let i = 0; i < 5; i++) {
      const cloud = document.createElement('div');
      cloud.className = 'cloud';
      cloud.style.top = (5 + Math.random() * 30) + '%';
      cloud.style.animationDuration = (30 + Math.random() * 30) + 's';
      cloud.style.animationDelay = -Math.random() * 30 + 's';
      cloud.style.transform = `scale(${0.8 + Math.random() * 1.2})`;
      document.body.appendChild(cloud);
    }

    // -------------------------------------------------------
    // Lógica del menú
    // -------------------------------------------------------
    const SAVE_KEY = 'foodquest_save';
    const btnNew      = document.getElementById('btn-new');
    const btnContinue = document.getElementById('btn-continue');
    const btnCredits  = document.getElementById('btn-credits');

    // Continuar: habilitado solo si hay partida guardada
    if (localStorage.getItem(SAVE_KEY)) {
      btnContinue.disabled = false;
    }

    btnNew.addEventListener('click', () => {
      // Marca progreso inicial; ver la intro
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        createdAt: Date.now(),
        progress: 'intro'
      }));
      window.location.href = 'intro.html';
    });

    btnContinue.addEventListener('click', () => {
      window.location.href = 'world.html';
    });

    btnCredits.addEventListener('click', () => {
      alert(
        'FOOD QUEST\n' +
        'Mundo Seguro VR\n\n' +
        'Construido con A-Frame WebVR\n' +
        'Diseñado para terapia con EEG (SDK Wavex)\n\n' +
        '© Wavex 2026'
      );
    });

    // Atajo de teclado: Enter = Nueva Partida
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnNew.click();
    });
  </script>
</body>
</html>
